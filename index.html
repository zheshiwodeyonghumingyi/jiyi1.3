<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>计亿</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --primary: #2c9c69;
  --primary-light: #e8f5e9;
  --primary-dark: #1b6b46;
  --bg: #f4f9f4;
  --card: #ffffff;
  --text: #2c3e2e;
  --text-secondary: #7a8f7c;
  --border: #e0efe0;
  --shadow: 0 4px 16px rgba(44, 156, 105, 0.08);
  --radius: 18px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 500px;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
}
#mainContent {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
  -webkit-overflow-scrolling: touch;
}
.bottom-nav {
  flex-shrink: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  z-index: 100;
}
.header {
  flex-shrink: 0;
  padding: 16px 16px 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg);
}
.hidden { display: none !important; }
.flex { display: flex; align-items: center; }
.flex-between { justify-content: space-between; }
.flex-col { flex-direction: column; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.text-sm { font-size: 13px; color: var(--text-secondary); }
.text-xs { font-size: 11px; color: var(--text-secondary); }
.text-lg { font-size: 22px; font-weight: 700; }
.text-xl { font-size: 28px; font-weight: 800; }
.text-green { color: var(--primary); }
.text-red { color: #e74c3c; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.p-16 { padding: 16px; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.card-title { font-size: 16px; font-weight: 600; }
.avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--primary-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  border: 2px solid var(--primary);
  overflow: hidden;
}
.greeting { font-size: 17px; font-weight: 600; }
.greeting-sub { font-size: 12px; color: var(--text-secondary); }
.nav-item {
  display: flex; flex-direction: column; align-items: center;
  font-size: 10px; color: var(--text-secondary);
  gap: 2px; cursor: pointer; padding: 4px 8px;
  transition: color 0.2s;
}
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-fab {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin-top: -20px;
  box-shadow: 0 4px 12px rgba(44, 156, 105, 0.4);
  cursor: pointer;
  transition: transform 0.2s;
  flex-shrink: 0;
}
.nav-fab:active { transform: scale(0.92); }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  text-align: center;
  padding: 8px 0;
}
.summary-item .label { font-size: 12px; color: var(--text-secondary); }
.summary-item .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
.summary-item .value.income { color: var(--primary); }
.summary-item .value.expense { color: #e74c3c; }
.account-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-radius: 14px;
  margin-bottom: 8px;
  color: #fff;
  cursor: pointer;
}
.account-item.wechat { background: linear-gradient(135deg, #2dc100, #1a8a00); }
.account-item.alipay { background: linear-gradient(135deg, #1677ff, #0a5cc4); }
.account-item.custom { background: linear-gradient(135deg, #8e9eab, #6b7b8d); }
.handbook-container {
  position: relative;
  background: #fdfcf8;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  min-height: 360px;
  padding: 20px;
  overflow: hidden;
  border: 1px solid #e8e0d0;
}
.handbook-page {
  display: flex; gap: 20px;
  transition: transform 0.4s ease;
  height: 100%;
}
.page-left, .page-right {
  flex: 1;
  padding: 12px;
  position: relative;
}
.page-left { border-right: 2px dashed #d4c9b0; }
.handbook-date { font-size: 28px; font-weight: 800; color: #2c3e2e; }
.handbook-mood { font-size: 20px; }
.handbook-card {
  background: #e8f5e9; border-radius: 8px; padding: 8px 12px;
  margin-top: 8px; font-size: 13px; line-height: 1.6;
}
.handbook-card.blue { background: #e3f2fd; }
.handbook-card.green { background: #e8f5e9; }
.page-nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  opacity: 0.7; z-index: 10;
}
.page-nav-btn:active { opacity: 1; }
.page-nav-btn.left { left: -8px; }
.page-nav-btn.right { right: -8px; }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-box {
  background: var(--card); border-radius: 14px; padding: 16px;
  text-align: center; box-shadow: var(--shadow);
}
.stat-box .num { font-size: 24px; font-weight: 800; }
.stat-box .label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
}
.modal-content {
  background: #fff; width: 100%; max-width: 500px;
  border-radius: 24px 24px 0 0;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  max-height: 80vh; overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.modal-header h3 { font-size: 18px; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; border: none;
}
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.form-input, .form-select {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 12px; font-size: 15px; background: var(--bg);
  outline: none; font-family: var(--font);
}
.form-input:focus, .form-select:focus { border-color: var(--primary); }
.btn {
  padding: 12px 24px; border-radius: 12px; border: none;
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: opacity 0.2s; width: 100%;
}
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
.drawer {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 150; display: flex; justify-content: flex-start;
}
.drawer-content {
  background: var(--bg); width: 260px; height: 100%;
  padding: 20px; overflow-y: auto;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
.drawer-item {
  padding: 12px 16px; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  font-size: 15px; margin-bottom: 4px;
}
.drawer-item:hover, .drawer-item.active { background: var(--primary-light); }
.drawer-item .icon { font-size: 20px; }
.todo-check {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--primary);
  cursor: pointer;
  font-size: 14px;
  color: var(--primary);
  flex-shrink: 0;
  transition: all 0.2s;
}
.todo-check.completed {
  background: var(--primary);
  color: #fff;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.calendar-day {
  background: var(--card);
  border-radius: 8px;
  padding: 6px 2px;
  text-align: center;
  min-height: 44px;
  position: relative;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.calendar-day .day-num { font-size: 13px; font-weight: 600; }
.calendar-day .day-todos { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }
.calendar-day.has-todo::after {
  content: '';
  position: absolute;
  bottom: 4px; left: 50%;
  transform: translateX(-50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--primary);
}
.calendar-year-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.year-month-card {
  background: var(--card);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.year-month-card .month-name { font-size: 16px; font-weight: 700; }
.year-month-card .month-stats { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.ledger-check-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.ledger-check-item input[type="checkbox"] {
  width: 20px; height: 20px;
  accent-color: var(--primary);
  cursor: pointer;
}

/* ============ 塔罗牌 ============ */
.tarot-stage {
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 220px;
  padding: 10px 0;
}
.tarot-back {
  width: 100px;
  height: 160px;
  border-radius: 10px;
  background: radial-gradient(circle at 30% 20%, #2c9c69 0%, #1b3a2c 60%, #0f2419 100%);
  border: 2px solid #d4af37;
  box-shadow:
    0 6px 20px rgba(0,0,0,0.35),
    inset 0 0 30px rgba(212, 175, 55, 0.15),
    inset 0 0 0 1px rgba(212, 175, 55, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
  transform-style: preserve-3d;
  user-select: none;
}
.tarot-back::before {
  content: '☀';
  font-size: 40px;
  color: #d4af37;
  opacity: 0.85;
  text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
}
.tarot-back::after {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(212, 175, 55, 0.5);
  border-radius: 6px;
  pointer-events: none;
}
.tarot-back.ghost {
  animation: tarot-float 3s ease-in-out infinite;
  cursor: default;
}
@keyframes tarot-float {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-10px) rotate(2deg); }
}
.tarot-shuffle-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 220px;
  position: relative;
}
.tarot-shuffle-stage .tarot-back {
  position: absolute;
  width: 80px;
  height: 128px;
  animation: tarot-shuffle 1s ease-in-out infinite;
}
.tarot-shuffle-stage .tarot-back:nth-child(1) { animation-delay: 0s; }
.tarot-shuffle-stage .tarot-back:nth-child(2) { animation-delay: 0.15s; }
.tarot-shuffle-stage .tarot-back:nth-child(3) { animation-delay: 0.3s; }
.tarot-shuffle-stage .tarot-back:nth-child(4) { animation-delay: 0.45s; }
@keyframes tarot-shuffle {
  0%   { transform: translateX(-70px) translateY(0) rotate(-15deg); }
  25%  { transform: translateX(0)     translateY(-15px) rotate(0deg); }
  50%  { transform: translateX(70px)  translateY(0) rotate(15deg); }
  75%  { transform: translateX(0)     translateY(-15px) rotate(0deg); }
  100% { transform: translateX(-70px) translateY(0) rotate(-15deg); }
}
.tarot-fan {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 6px;
  padding: 30px 0 10px;
  flex-wrap: nowrap;
  overflow-x: auto;
}
.tarot-fan .tarot-back {
  width: 54px;
  height: 86px;
  flex-shrink: 0;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.tarot-fan .tarot-back::before { font-size: 22px; }
.tarot-fan .tarot-back::after { inset: 4px; }
.tarot-fan .tarot-back:hover,
.tarot-fan .tarot-back:active {
  transform: translateY(-16px) scale(1.08);
  box-shadow: 0 12px 28px rgba(44, 156, 105, 0.5);
}
.tarot-reveal {
  animation: tarot-flip 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}
@keyframes tarot-flip {
  0%   { transform: rotateY(0deg)   scale(1); }
  50%  { transform: rotateY(90deg)  scale(1.15); }
  100% { transform: rotateY(360deg) scale(1); }
}
.tarot-stars {
  position: relative;
  padding: 10px 0;
}
.tarot-stars::before {
  content: '✦';
  position: absolute;
  left: 15%; top: 20%;
  color: #d4af37;
  font-size: 10px;
  animation: twinkle 2s ease-in-out infinite;
}
.tarot-stars::after {
  content: '✦';
  position: absolute;
  right: 18%; top: 30%;
  color: #d4af37;
  font-size: 8px;
  animation: twinkle 2s ease-in-out infinite 0.7s;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

/* ============ 习惯打卡页面 ============ */
.habit-page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0 8px;
}
.habit-week-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  color: var(--text);
  font-weight: 600;
  padding: 12px 0;
}
.habit-week-nav span {
  cursor: pointer;
  font-size: 20px;
  color: var(--text-secondary);
  user-select: none;
}
.habit-days-header {
  display: grid;
  grid-template-columns: 80px repeat(7, 1fr);
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
  padding: 12px 0 8px;
  border-bottom: 1px solid var(--border);
}
.habit-row {
  display: grid;
  grid-template-columns: 80px repeat(7, 1fr);
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.habit-name {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.habit-circle {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid #d4e0d6;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  color: transparent;
  font-size: 14px;
}
.habit-circle.checked {
  background: #88c0a0;
  border-color: #88c0a0;
  color: #fff;
}
.habit-circle.today {
  box-shadow: 0 0 0 3px rgba(136, 192, 160, 0.3);
}
.habit-stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-secondary);
  padding: 16px 0;
}
.habit-adjust-btn {
  width: 100%;
  padding: 14px;
  background: var(--primary-light);
  color: var(--primary);
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  text-align: center;
}
.habit-fab {
  position: fixed;
  bottom: 90px;
  right: calc(50% - 250px + 20px);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #2c3e2e;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  cursor: pointer;
  z-index: 50;
}
@media (max-width: 500px) {
  .habit-fab { right: 20px; }
}

@media (min-width: 500px) {
  .app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header" id="appHeader">
    <div class="flex gap-12">
      <div class="avatar" id="avatarEl">☀️</div>
      <div>
        <div class="greeting" id="greetingText">你好</div>
        <div class="greeting-sub" id="greetingDate"></div>
      </div>
    </div>
    <div class="flex gap-8">
      <span style="font-size:22px;cursor:pointer;" onclick="exportData()">📥</span>
      <span style="font-size:22px;cursor:pointer;" onclick="openDrawer()">☰</span>
    </div>
  </div>

  <div id="mainContent"></div>

  <div class="bottom-nav">
    <div class="nav-item active" data-page="today" onclick="switchPage('today')">
      <span class="nav-icon">🏠</span>
      <span>今天</span>
    </div>
    <div class="nav-item" data-page="calendar" onclick="switchPage('calendar')">
      <span class="nav-icon">📅</span>
      <span>日历</span>
    </div>
    <div class="nav-fab" onclick="openAddModal()">+</div>
    <div class="nav-item" data-page="assets" onclick="switchPage('assets')">
      <span class="nav-icon">💰</span>
      <span>资产</span>
    </div>
    <div class="nav-item" data-page="profile" onclick="switchPage('profile')">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </div>
  </div>
</div>

<div id="modalContainer"></div>
<div id="drawerContainer"></div>

<script>
/* ============================================================
   计亿 App - 核心逻辑
   ============================================================ */

const APP_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#f4f9f4"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#2c9c69" stroke-width="22"/>
  <circle cx="256" cy="256" r="40" fill="#2c9c69" opacity="0.25"/>
  <g stroke="#2c9c69" stroke-width="22" stroke-linecap="round">
    <line x1="256" y1="70" x2="256" y2="120"/>
    <line x1="256" y1="392" x2="256" y2="442"/>
    <line x1="70" y1="256" x2="120" y2="256"/>
    <line x1="392" y1="256" x2="442" y2="256"/>
    <line x1="124" y1="124" x2="160" y2="160"/>
    <line x1="352" y1="352" x2="388" y2="388"/>
    <line x1="388" y1="124" x2="352" y2="160"/>
    <line x1="160" y1="352" x2="124" y2="388"/>
  </g>
</svg>`;

(function setFavicon() {
  const link = document.createElement('link');
  link.rel = 'icon';
  link.type = 'image/svg+xml';
  link.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(APP_ICON_SVG);
  document.head.appendChild(link);
})();

const DEFAULT_DATA = {
  ledgers: [
    {
      id: 'default',
      name: '默认账本',
      transactions: [],
      accounts: [
        { id: 'acc_wechat', name: '微信', type: 'wechat', balance: 0 },
        { id: 'acc_alipay', name: '支付宝', type: 'alipay', balance: 0 }
      ],
      deposits: [],
      budget: 0
    }
  ],
  notes: [],
  journals: [],
  habits: [],
  todos: [],
  tarot: {},
  summaries: [],
  settings: {
    currentLedgerId: 'default',
    signature: '',
    theme: 'green'
  }
};

const Store = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem('jiyi_data');
      this.data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
    } catch(e) {
      this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
    if (!this.data.ledgers) {
      const old = this.data;
      this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      if (old.transactions) this.data.ledgers[0].transactions = old.transactions;
      if (old.accounts) this.data.ledgers[0].accounts = old.accounts;
      if (old.deposits) this.data.ledgers[0].deposits = old.deposits;
      if (old.notes) this.data.notes = old.notes;
      if (old.journals) this.data.journals = old.journals;
      if (old.habits) this.data.habits = old.habits;
      if (old.todos) this.data.todos = old.todos;
      if (old.tarot) this.data.tarot = old.tarot;
      if (old.summaries) this.data.summaries = old.summaries;
      if (old.settings) {
        this.data.settings.signature = old.settings.signature || '';
      }
    }
    for (let key in DEFAULT_DATA) {
      if (!(key in this.data)) this.data[key] = DEFAULT_DATA[key];
    }
    // 兼容旧习惯数据结构
    this.data.habits.forEach(h => {
      if (!h.checkins) h.checkins = [];
      if (!h.icon) h.icon = '📌';
      if (!h.type) h.type = 'long';
      if (!h.period) h.period = 'week';
    });
    return this.data;
  },
  save() {
    try {
      localStorage.setItem('jiyi_data', JSON.stringify(this.data));
    } catch(e) {
      alert('存储空间不足，请及时导出备份！');
    }
  },
  genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  getCurrentLedger() {
    const id = this.data.settings.currentLedgerId;
    return this.data.ledgers.find(l => l.id === id) || this.data.ledgers[0];
  }
};

const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const formatDate = (d) => {
  const dt = new Date(d);
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
};
const formatMoney = (n) => {
  if (n === undefined || n === null || isNaN(n)) return '0.00';
  return Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
};
const getWeekRange = (date) => {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const start = new Date(d.setDate(diff));
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  return { start, end };
};
const getMonthRange = (date) => {
  const d = new Date(date);
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { start, end };
};

function getAllActiveDates() {
  const data = Store.data;
  const dates = new Set();
  data.journals.forEach(j => dates.add(j.date));
  data.notes.forEach(n => dates.add(n.date));
  data.todos.forEach(t => dates.add(t.date));
  Store.data.ledgers.forEach(l => l.transactions.forEach(t => dates.add(t.date)));
  data.habits.forEach(h => (h.checkins || []).forEach(d => dates.add(d)));
  return Array.from(dates).sort();
}
function getStreakDays() { return getAllActiveDates().length; }
function getLongestStreak() {
  const dates = getAllActiveDates();
  if (dates.length === 0) return 0;
  let max = 1, cur = 1;
  for (let i = 1; i < dates.length; i++) {
    const prev = new Date(dates[i-1] + 'T00:00:00');
    const curr = new Date(dates[i] + 'T00:00:00');
    const diff = Math.round((curr - prev) / (1000 * 60 * 60 * 24));
    if (diff === 1) { cur++; max = Math.max(max, cur); }
    else { cur = 1; }
  }
  return max;
}
function getWeekCheckinRate() {
  const now = new Date();
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1);
  const start = new Date(now.getFullYear(), now.getMonth(), diff);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  end.setHours(23,59,59,999);
  const dates = getAllActiveDates();
  const thisWeek = dates.filter(d => {
    const dt = new Date(d + 'T00:00:00');
    return dt >= start && dt <= end;
  });
  return Math.round((thisWeek.length / 7) * 100);
}
function getCompletedTodoCount() {
  return Store.data.todos.filter(t => t.completed).length;
}
function getEssayDays() {
  const days = new Set(Store.data.notes.filter(n => n.type === 'essay').map(n => n.date));
  return days.size;
}

function renderCalendar() {
  const now = new Date();
  const { start: weekStart, end: weekEnd } = getWeekRange(now);
  const weekStr = `${weekStart.getMonth()+1}/${weekStart.getDate()} - ${weekEnd.getMonth()+1}/${weekEnd.getDate()}`;

  let viewContent = '';

  if (currentCalendarMode === 'week') {
    const days = [];
    for (let d = new Date(weekStart); d <= weekEnd; d.setDate(d.getDate() + 1)) {
      days.push(new Date(d));
    }
    viewContent = days.map(d => {
      const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const todos = Store.data.todos.filter(t => t.date === dateStr);
      const isToday = dateStr === todayStr();
      return `
        <div class="card" style="${isToday ? 'border:2px solid var(--primary);' : ''}display:flex;gap:12px;align-items:flex-start;">
          <div style="text-align:center;min-width:50px;">
            <div style="font-size:22px;font-weight:800;${isToday ? 'color:var(--primary);' : ''}">${d.getDate()}</div>
            <div class="text-xs">${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}</div>
          </div>
          <div style="flex:1;">
            ${todos.length > 0 ? todos.map(t => `
              <div class="flex gap-8" style="margin-bottom:4px;align-items:center;">
                <span class="todo-check ${t.completed ? 'completed' : ''}" onclick="toggleTodo('${t.id}')">${t.completed ? '✓' : ''}</span>
                <span class="text-sm" style="${t.completed ? 'text-decoration:line-through;color:#999;' : ''}">${t.content}</span>
              </div>
            `).join('') : '<div class="text-sm" style="color:#ccc;">暂无事项</div>'}
            <div class="text-xs text-green mt-8" style="cursor:pointer;" onclick="addTodo('${dateStr}')">+ 添加事项</div>
          </div>
        </div>
      `;
    }).join('');
  } else if (currentCalendarMode === 'month') {
    const year = now.getFullYear();
    const month = now.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startWeekday = firstDay.getDay();
    const blanks = startWeekday === 0 ? 6 : startWeekday - 1;

    let gridHtml = '<div class="calendar-grid">';
    const weekdays = ['一','二','三','四','五','六','日'];
    weekdays.forEach(w => {
      gridHtml += `<div style="text-align:center;font-size:11px;color:var(--text-secondary);padding:4px 0;">${w}</div>`;
    });
    for (let i = 0; i < blanks; i++) gridHtml += '<div></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const todos = Store.data.todos.filter(t => t.date === dateStr);
      const hasTodo = todos.length > 0;
      const isToday = dateStr === todayStr();
      gridHtml += `
        <div class="calendar-day ${hasTodo ? 'has-todo' : ''}" style="${isToday ? 'border:2px solid var(--primary);' : ''}" onclick="addTodo('${dateStr}')">
          <div class="day-num" style="${isToday ? 'color:var(--primary);' : ''}">${d}</div>
          ${hasTodo ? `<div class="day-todos">${todos.length}项</div>` : ''}
        </div>
      `;
    }
    gridHtml += '</div>';
    viewContent = gridHtml;
  } else if (currentCalendarMode === 'year') {
    const year = now.getFullYear();
    let monthCards = '';
    for (let m = 0; m < 12; m++) {
      const firstDay = `${year}-${String(m+1).padStart(2,'0')}-01`;
      const lastDay = new Date(year, m + 1, 0).getDate();
      const lastDate = `${year}-${String(m+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
      const todos = Store.data.todos.filter(t => t.date >= firstDay && t.date <= lastDate);
      const done = todos.filter(t => t.completed).length;
      monthCards += `
        <div class="year-month-card" onclick="setCalendarMonth(${m})">
          <div class="month-name">${m+1}月</div>
          <div class="month-stats">${done}/${todos.length} 项</div>
        </div>
      `;
    }
    viewContent = `<div class="calendar-year-grid">${monthCards}</div>`;
  }

  return `
    <div class="flex gap-8 mb-16" style="justify-content:center;">
      <span class="text-sm" style="padding:6px 16px;border-radius:20px;cursor:pointer;${currentCalendarMode==='week' ? 'background:var(--primary);color:#fff;' : 'background:var(--border);'}" onclick="changeCalendarMode('week')">周</span>
      <span class="text-sm" style="padding:6px 16px;border-radius:20px;cursor:pointer;${currentCalendarMode==='month' ? 'background:var(--primary);color:#fff;' : 'background:var(--border);'}" onclick="changeCalendarMode('month')">月</span>
      <span class="text-sm" style="padding:6px 16px;border-radius:20px;cursor:pointer;${currentCalendarMode==='year' ? 'background:var(--primary);color:#fff;' : 'background:var(--border);'}" onclick="changeCalendarMode('year')">年</span>
    </div>

    <div class="flex flex-between mb-16">
      <span style="font-size:16px;font-weight:600;">${currentCalendarMode === 'week' ? weekStr : (currentCalendarMode === 'month' ? `${now.getFullYear()}年${now.getMonth()+1}月` : `${now.getFullYear()}年`)}</span>
      <span class="text-sm text-green" style="cursor:pointer;" onclick="switchPage('today')">回到今天</span>
    </div>

    ${viewContent}

    <div class="card mt-16">
      <div class="card-title mb-8">📋 本周事项</div>
      <div class="text-sm" style="color:#999;text-align:center;padding:20px 0;">
        ${Store.data.todos.filter(t => {
          const d = new Date(t.date + 'T00:00:00');
          return d >= weekStart && d <= weekEnd;
        }).length} 项本周事项
      </div>
    </div>
  `;
}

  renderPage();

/* ============================================================
   小结系统
   ============================================================ */
function makeSummary(type, startDate, endDate, title) {
  const data = Store.data;
  const inRange = (d) => d >= startDate && d <= endDate;
  const allTxs = data.ledgers.flatMap(l => l.transactions);
  const txs = allTxs.filter(t => inRange(t.date));
  const income = txs.filter(t => t.type === 'income').reduce((s,t)=>s+t.amount,0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s,t)=>s+t.amount,0);
  const todos = data.todos.filter(t => inRange(t.date));
  const doneTodos = todos.filter(t => t.completed);
  const journals = data.journals.filter(j => inRange(j.date));
  const notes = data.notes.filter(n => inRange(n.date));
  const habitCheckins = data.habits.reduce((s,h)=> s + (h.checkins||[]).filter(d=>inRange(d)).length, 0);

  const lines = [];
  if (txs.length > 0) lines.push(`收入 ${formatMoney(income)} 元，支出 ${formatMoney(expense)} 元`);
  if (todos.length > 0) lines.push(`完成 ${doneTodos.length}/${todos.length} 项待办`);
  if (habitCheckins > 0) lines.push(`习惯打卡 ${habitCheckins} 次`);
  if (journals.length > 0) lines.push(`写了 ${journals.length} 篇手帐`);
  if (notes.length > 0) lines.push(`写了 ${notes.length} 篇随笔/备忘`);
  if (lines.length === 0) lines.push('这一段时间没有记录，下次继续。');

  return {
    id: Store.genId(),
    type,
    title,
    date: todayStr(),
    startDate: startDate,
    endDate: endDate,
    content: lines.join('\n')
  };
}

function autoGenerateSummaries() {
  const data = Store.data;
  const today = todayStr();
  const now = new Date();

  const existingToday = data.summaries.find(s => s.type === 'day' && s.endDate === today);
  if (existingToday) {
    const newS = makeSummary('day', today, today, `日结 · ${today}`);
    existingToday.content = newS.content;
  } else {
    data.summaries.push(makeSummary('day', today, today, `日结 · ${today}`));
  }
  Store.save();

  const day = now.getDay();
  if (day === 1) {
    const lastWeekStart = new Date(now);
    lastWeekStart.setDate(now.getDate() - 7);
    const lastWeekEnd = new Date(now);
    lastWeekEnd.setDate(now.getDate() - 1);
    const s = `${lastWeekStart.getFullYear()}-${String(lastWeekStart.getMonth()+1).padStart(2,'0')}-${String(lastWeekStart.getDate()).padStart(2,'0')}`;
    const e = `${lastWeekEnd.getFullYear()}-${String(lastWeekEnd.getMonth()+1).padStart(2,'0')}-${String(lastWeekEnd.getDate()).padStart(2,'0')}`;
    if (!data.summaries.find(x => x.type === 'week' && x.startDate === s)) {
      data.summaries.push(makeSummary('week', s, e, `周结 · ${s} 至 ${e}`));
      Store.save();
    }
  }

  if (now.getDate() === 1) {
    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0);
    const s = `${lastMonth.getFullYear()}-${String(lastMonth.getMonth()+1).padStart(2,'0')}-01`;
    const e = `${lastMonthEnd.getFullYear()}-${String(lastMonthEnd.getMonth()+1).padStart(2,'0')}-${String(lastMonthEnd.getDate()).padStart(2,'0')}`;
    if (!data.summaries.find(x => x.type === 'month' && x.startDate === s)) {
      data.summaries.push(makeSummary('month', s, e, `月结 · ${lastMonth.getFullYear()}年${lastMonth.getMonth()+1}月`));
      Store.save();
    }
  }

  if (now.getMonth() === 0 && now.getDate() === 1) {
    const lastYear = now.getFullYear() - 1;
    const s = `${lastYear}-01-01`;
    const e = `${lastYear}-12-31`;
    if (!data.summaries.find(x => x.type === 'year' && x.startDate === s)) {
      data.summaries.push(makeSummary('year', s, e, `年结 · ${lastYear}年`));
      Store.save();
    }
  }
}

  autoGenerateSummaries();
  alert('小结已更新，历史记录会完整保留。');

/* ============================================================

   ============================================================ */
function buildHandbookPages() {
  const data = Store.data;
  const dates = [];
  const today = new Date();
  for (let i = 1; i <= 16; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i + 1);
    dates.push(d);
  }
  handbookPages = dates.map(d => {
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const journal = data.journals.find(j => j.date === dateStr);
    const dayTodos = data.todos.filter(t => t.date === dateStr);
    const dayHabits = data.habits.filter(h => h.checkins && h.checkins.includes(dateStr));
    const cards = [];
    if (dayTodos.length > 0) {
      cards.push({ color: 'green', content: `《今日完成》\n${dayTodos.map(t => `${t.completed ? '●' : '○'} ${t.content}`).join('\n')}` });
    }
    if (dayHabits.length > 0) {
      cards.push({ color: 'blue', content: `《习惯打卡》\n${dayHabits.map(h => `✅ ${h.name}`).join('\n')}` });
    }
    if (journal && journal.content) {
      cards.push({ color: 'green', content: `《碎碎念》\n${journal.content}` });
    }
    return {
      date: `${d.getMonth()+1}.${d.getDate()}`,
      mood: journal ? journal.mood : '😐',
      cards: cards.length > 0 ? cards : [{ color: 'green', content: '今天还没有记录，点下方 + 添加' }],
      rightContent: journal ? journal.rightContent || '' : ''
    };
  });
}

function changeHandbookPage(dir) {
  const total = handbookPages.length;
  currentHandbookPage = Math.max(0, Math.min(total - 1, currentHandbookPage + dir));
  if (currentPage === 'today') renderPage();
  else openHandbook();

  const amount = parseFloat($('#txAmount').value);
  if (!amount || amount <= 0) return alert('请输入有效金额');
  const tx = {
    id: Store.genId(),
    type,
    amount,
    category: $('#txCategory').value,
    accountId: $('#txAccount').value,
    date: $('#txDate').value,
    note: $('#txNote').value || ''
  };
  ledger.transactions.push(tx);
  const acc = ledger.accounts.find(a => a.id === tx.accountId);

   习惯（独立页面版本）
   ============================================================ */
function openHabitPage() {
  currentPage = 'habits';
  $$('.nav-item').forEach(el => el.classList.remove('active'));
  renderPage();
  $('#mainContent').scrollTop = 0;
}

function renderHabitPage() {
  const now = new Date();
  const currentDay = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - currentDay + 1 + habitWeekOffset * 7);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  const getWeekNumber = (d) => {
    const date = new Date(d);
    date.setHours(0, 0, 0, 0);
    date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
    const week1 = new Date(date.getFullYear(), 0, 4);
    return 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
  };
  const weekStr = `第 ${getWeekNumber(monday)} 周 · ${monday.getMonth()+1}/${monday.getDate()} - ${sunday.getMonth()+1}/${sunday.getDate()}`;

  const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
  const datesOfWeek = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    datesOfWeek.push(`${yyyy}-${mm}-${dd}`);
  }

  const habits = Store.data.habits;
  let totalCompleted = 0;
  let todayCompleted = 0;
  const todayStrValue = todayStr();

  habits.forEach(h => {
    if (!h.checkins) h.checkins = [];
    datesOfWeek.forEach(d => { if (h.checkins.includes(d)) totalCompleted++; });
    if (h.checkins.includes(todayStrValue)) todayCompleted++;
  });

  const habitRows = habits.map(h => {
    const circles = datesOfWeek.map(d => {
      const checked = h.checkins.includes(d);
      const isToday = d === todayStrValue;
      return `<div class="habit-circle ${checked ? 'checked' : ''} ${isToday ? 'today' : ''}" onclick="toggleHabitCheckin('${h.id}', '${d}')">${checked ? '✓' : ''}</div>`;
    }).join('');
    return `
      <div class="habit-row">
        <div class="habit-name">${h.icon || '📌'} ${h.name}</div>
        ${circles}
      </div>
    `;
  }).join('');

  const hasHabits = habits.length > 0;

  return `
    <div class="habit-page-header">
      <div class="flex gap-12" style="align-items:center;">
        <span style="font-size:18px;font-weight:600;">习惯</span>
      </div>
      <span style="font-size:20px;cursor:pointer;" onclick="switchPage('today')">✕</span>
    </div>

    <div class="habit-week-nav">
      <span onclick="changeHabitWeek(-1)">‹</span>
      <span>${weekStr}</span>
      <span onclick="changeHabitWeek(1)">›</span>
    </div>

    ${hasHabits ? `
      <div class="habit-days-header">
        <div></div>
        ${weekdays.map(d => `<div>${d}</div>`).join('')}
      </div>
      ${habitRows}
      <div class="habit-stats">
        <span>本周完成 <strong>${totalCompleted}</strong> / ${habits.length * 7}</span>
        <span>今天 <strong>${todayCompleted}</strong> / ${habits.length}</span>
      </div>
      <button class="habit-adjust-btn" onclick="alert('拖拽排序功能开发中，敬请期待！')">调整顺序</button>
    ` : `
      <div class="card" style="text-align:center;padding:40px 0;color:#999;">
        <div style="font-size:40px;margin-bottom:12px;">📝</div>
        <div>还没有习惯，点右下角添加一个吧</div>
      </div>
    `}

    <div class="habit-fab" onclick="openAddHabitModal()">+</div>
  `;
}

function changeHabitWeek(offset) {
  habitWeekOffset += offset;
  renderPage();
}

function toggleHabitCheckin(habitId, dateStr) {
  const habit = Store.data.habits.find(h => h.id === habitId);
  if (!habit) return;
  if (!habit.checkins) habit.checkins = [];
  const idx = habit.checkins.indexOf(dateStr);
  if (idx >= 0) habit.checkins.splice(idx, 1);
  else habit.checkins.push(dateStr);
  Store.save();
  renderPage();
}

        <div style="font-size:24px;font-weight:700;margin-top:20px;color:var(--primary);">
          ${card.name}${reverse ? ' · 逆位' : ''}
        </div>
        <div class="text-sm" style="margin-top:14px;line-height:1.9;padding:0 12px;color:var(--text);">
          ${reverse ? '⚠ ' + card.interpretation + '（提醒你留意反面的可能）' : card.interpretation}
        </div>
      </div>
      <button class="btn btn-primary mt-16" onclick="closeModal();renderPage()">收下指引</button>
    `;
  }

  openModal(`
    <div class="modal-header">
      <h3>🔮 每日塔罗</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    ${body}
  `);
}

function startTarotShuffle() {
  tarotState.step = 'shuffling';
  renderTarotModal();
  setTimeout(() => {
    tarotState.step = 'picking';
    renderTarotModal();
  }, 2400);
}

function pickTarotCard(index) {
  const card = TAROT_CARDS[Math.floor(Math.random() * TAROT_CARDS.length)];
  tarotState.selectedCard = card;
  tarotState.step = 'revealed';
  Store.data.tarot[todayStr()] = { card: card.name, interpretation: card.interpretation };
  Store.save();
  renderTarotModal();
}

function showTarotResult(t) {
  openModal(`
    <div class="modal-header">
      <h3>🔮 今日塔罗</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="tarot-stars" style="text-align:center;padding:20px 0;">
      <div class="text-sm" style="color:var(--text-secondary);margin-bottom:14px;">今日指引</div>
      <div class="tarot-back" style="margin:0 auto;"></div>
      <div style="font-size:24px;font-weight:700;margin-top:20px;color:var(--primary);">${t.card}</div>
      <div class="text-sm" style="margin-top:14px;line-height:1.9;padding:0 12px;">
        ${t.interpretation}
      </div>
    </div>
    <button class="btn btn-primary" onclick="closeModal()">好的</button>

}

/* ============================================================
   定期存款
   ============================================================ */
function openDepositModal() {
  openModal(`
    <div class="modal-header">
      <h3>添加定期存款</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>本金（元）</label>
      <input type="number" class="form-input" id="depPrincipal" placeholder="例如：4000">
    </div>
    <div class="form-group">
      <label>年利率（%）</label>
      <input type="number" class="form-input" id="depRate" placeholder="例如：1.95" step="0.01">
    </div>
    <div class="form-group">
      <label>存入日期</label>
      <input type="date" class="form-input" id="depStart" value="${todayStr()}" onchange="calcDepositEnd()">
    </div>
    <div class="form-group">
      <label>存期</label>
      <select class="form-select" id="depTerm" onchange="calcDepositEnd()">
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
        <option value="5">5年</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="form-group">
      <label>到期日期</label>
      <input type="date" class="form-input" id="depEnd">
    </div>
    <button class="btn btn-primary" onclick="saveDeposit()">保存</button>
  `);
}

function calcDepositEnd() {
  const start = $('#depStart').value;
  const term = $('#depTerm').value;
  if (term === 'custom') return;
  if (!start) return;
  const d = new Date(start);
  const years = parseInt(term);
  d.setFullYear(d.getFullYear() + years);
  const endStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  $('#depEnd').value = endStr;
}

function saveDeposit() {
  const ledger = Store.getCurrentLedger();
  const principal = parseFloat($('#depPrincipal').value);
  const rate = parseFloat($('#depRate').value) / 100;
  const start = $('#depStart').value;
  const end = $('#depEnd').value;
  if (!principal || !rate || !start || !end) return alert('请填写完整信息');
  const days = Math.round((new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24));
  const estimatedInterest = principal * rate * (days / 365);
  ledger.deposits.push({
    id: Store.genId(),
    principal,
    rate,
    startDate: start,
    endDate: end,
    days,
    estimatedInterest,
    status: 'active',
    accountId: ledger.accounts[0]?.id || 'acc_wechat'
  });
  Store.save();
  closeModal();
  renderPage();
}

/* ============================================================
   账户
   ============================================================ */
function openAccountModal() {
  openModal(`
    <div class="modal-header">
      <h3>添加账户</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>账户名称</label>
      <input type="text" class="form-input" id="accName" placeholder="例如：招商银行">
    </div>
    <div class="form-group">
      <label>账户类型</label>
      <select class="form-select" id="accType" onchange="toggleCustomType()">
        <option value="wechat">微信</option>
        <option value="alipay">支付宝</option>
        <option value="custom">自定义</option>
      </select>
      <div id="customTypeWrap" style="display:none;margin-top:8px;">
        <input type="text" class="form-input" id="customTypeName" placeholder="输入自定义类型名称，如：银行卡">
      </div>
    </div>
    <div class="form-group">
      <label>初始余额</label>
      <input type="number" class="form-input" id="accBalance" value="0">
    </div>
    <button class="btn btn-primary" onclick="saveAccount()">保存</button>
  `);
}

function toggleCustomType() {
  const type = $('#accType').value;
  $('#customTypeWrap').style.display = type === 'custom' ? 'block' : 'none';
}

function saveAccount() {
  const ledger = Store.getCurrentLedger();
  const name = $('#accName').value.trim();
  if (!name) return;
  const type = $('#accType').value;
  const customTypeName = type === 'custom' ? ($('#customTypeName').value.trim() || '自定义') : '';
  ledger.accounts.push({
    id: Store.genId(),
    name,
    type,
    customTypeName,
    balance: parseFloat($('#accBalance').value) || 0
  });
  Store.save();
  closeModal();
  renderPage();
}

function editAccount(id) {
  const ledger = Store.getCurrentLedger();
  const acc = ledger.accounts.find(a => a.id === id);
  if (!acc) return;
  const isCustom = acc.type === 'custom';
  openModal(`
    <div class="modal-header">
      <h3>编辑账户</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label>账户名称</label>
      <input type="text" class="form-input" id="editAccName" value="${acc.name}">
    </div>
    <div class="form-group">
      <label>账户类型</label>
      <select class="form-select" id="editAccType" onchange="toggleEditCustomType()">
        <option value="wechat" ${acc.type === 'wechat' ? 'selected' : ''}>微信</option>
        <option value="alipay" ${acc.type === 'alipay' ? 'selected' : ''}>支付宝</option>
        <option value="custom" ${acc.type === 'custom' ? 'selected' : ''}>自定义</option>
      </select>
      <div id="editCustomTypeWrap" style="display:${isCustom ? 'block' : 'none'};margin-top:8px;">
        <input type="text" class="form-input" id="editCustomTypeName" value="${acc.customTypeName || ''}" placeholder="自定义类型名称">
      </div>
    </div>
    <div class="form-group">
      <label>余额</label>
      <input type="number" class="form-input" id="editAccBalance" value="${acc.balance}">
    </div>
    <button class="btn btn-primary" onclick="updateAccount('${id}')">保存</button>
    ${ledger.accounts.length > 1 ? `<button class="btn btn-outline mt-8" style="color:#e74c3c;border-color:#e74c3c;" onclick="deleteAccount('${id}')">删除该账户</button>` : ''}
  `);
}

function toggleEditCustomType() {
  const type = $('#editAccType').value;
  $('#editCustomTypeWrap').style.display = type === 'custom' ? 'block' : 'none';
}

function updateAccount(id) {
  const ledger = Store.getCurrentLedger();
  const acc = ledger.accounts.find(a => a.id === id);
  if (!acc) return;
  acc.name = $('#editAccName').value;
  acc.type = $('#editAccType').value;
  acc.customTypeName = acc.type === 'custom' ? ($('#editCustomTypeName').value.trim() || '自定义') : '';
  acc.balance = parseFloat($('#editAccBalance').value) || 0;
  Store.save();
  closeModal();
  renderPage();
}

function deleteAccount(id) {
  if (!confirm('确定删除该账户？')) return;
  const ledger = Store.getCurrentLedger();
  ledger.accounts = ledger.accounts.filter(a => a.id !== id);
  Store.save();
  closeModal();
  renderPage();
}

/* ============================================================
   数据导出/导入
   ============================================================ */
function exportData() {
  const dataStr = JSON.stringify(Store.data, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `计亿备份_${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('数据已导出，请保存到手机文件管理器中。');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        Store.data = data;
        for (let key in DEFAULT_DATA) {
          if (!(key in Store.data)) Store.data[key] = DEFAULT_DATA[key];
        }
        Store.save();
        alert('数据导入成功！');
        renderPage();
      } catch(err) {
        alert('文件格式错误，导入失败。');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearData() {
  if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
    if (confirm('再次确认：所有记账、手帐、习惯数据都会被删除！')) {
      localStorage.removeItem('jiyi_data');
      Store.load();
      renderPage();
      alert('数据已清空');
    }
  }
}
